[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --timeout=30
    -n auto
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试
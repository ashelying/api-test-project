name: API Test CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 启动 Flask 服务
      run: |
        python my_flask_server.py &
        sleep 5
        curl -f http://127.0.0.1:8787/coupApply/cms/goodsList?msgType=getHandsetListOfCust || echo "服务启动中..."

    - name: 运行测试
      run: |
        pytest tests/ -v --html=reports/report.html --self-contained-html

    - name: 上传测试报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: reports/